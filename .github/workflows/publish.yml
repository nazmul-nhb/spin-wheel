name: Publish to NPM and Release with Tag

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      # Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # <- important to get full commit history
          fetch-tags: true

      # Get the current version from package.json
      - name: Get version from package.json
        id: get_version
        run: |
          VERSION=$(jq -r .version package.json)
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
      # Get the latest Git tag
      - name: Get latest Git tag
        id: get_latest_tag
        run: |
          git fetch --tags
          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -n 1)
          echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_ENV
          echo "Latest tag found: $LATEST_TAG"

      # Compare versions and skip if same
      - name: Check if version changed
        id: check_version
        run: |
          if [ "v${{ env.VERSION }}" = "${{ env.LATEST_TAG }}" ]; then
              echo "VERSION_UNCHANGED=true" >> $GITHUB_ENV
              echo "No new version to publish"
              exit 0
          else
              echo "VERSION_UNCHANGED=false" >> $GITHUB_ENV
              echo "New version detected: v${{ env.VERSION }}"
          fi
      # Setup Environment
      - name: Install PNPM
        if: env.VERSION_UNCHANGED == 'false'
        run: npm install -g pnpm

      - name: Setup Node.js
        if: env.VERSION_UNCHANGED == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org/"
      - name: Install Dependencies
        if: env.VERSION_UNCHANGED == 'false'
        run: pnpm install --frozen-lockfile
      # Sync subpackage versions to match root version before publishing
      # - name: Sync versions
      #   if: env.VERSION_UNCHANGED == 'false'
      #   run: |
      #     pnpm -r exec npm version ${{ env.VERSION }} --no-git-tag-version

      # Build all packages in the workspace
      - name: Build Packages
        if: env.VERSION_UNCHANGED == 'false'
        run: pnpm build

      # Publish all packages to NPM Registry
      - name: Publish to NPM Registry
        if: env.VERSION_UNCHANGED == 'false'
        run: |
          if [[ "$VERSION" =~ -(alpha|beta|rc) ]]; then
            echo "Pre-release detected, tag 'next'"
            pnpm -r publish --access public --tag next --no-git-checks
          else
            echo "Stable release, tag 'latest'"
            pnpm -r publish --access public --no-git-checks
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # Generate release notes
      - name: Generate Release Notes
        if: env.VERSION_UNCHANGED == 'false'
        id: gen_notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --tags --prune

          if [ -z "$LATEST_TAG" ]; then
            # Handle first release
            pnpm dlx changelog-maker > release_notes.md
          else
            TAG_SHA=$(git rev-parse "$LATEST_TAG")
            FIRST_AFTER=$(git rev-list --reverse "$LATEST_TAG..HEAD" | head -n 1 || true)

            if [ -z "$FIRST_AFTER" ]; then
              printf "" > release_notes.md
            else
              pnpm dlx changelog-maker --start-ref "$FIRST_AFTER" > release_notes.md
            fi
            
            if [ -n "$TAG_SHA" ] && grep -q "$TAG_SHA" release_notes.md 2>/dev/null; then
              echo "::warning::Tag commit SHA found inside release_notes.md"
              exit 1
            fi
          fi

          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          cat release_notes.md >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      # Create Git tag
      - name: Create Git Tag
        if: env.VERSION_UNCHANGED == 'false'
        run: |
          git tag v${{ env.VERSION }}
          git push origin v${{ env.VERSION }}
      # Create GitHub Release
      - name: Create Release
        if: env.VERSION_UNCHANGED == 'false'
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "v${{ env.VERSION }}"
          name: "v${{ env.VERSION }}"
          body: |
            ## 📦 spin-wheel v${{ env.VERSION }}
              
            ### 🆕 Release Notes
            ${{ steps.gen_notes.outputs.body }}

            **Compare Changes:** [${{ env.LATEST_TAG || 'initial' }} vs v${{ env.VERSION }}](https://github.com/${{ github.repository }}/compare/${{ env.LATEST_TAG || github.event.before }}...v${{ env.VERSION }})

            ---
            **[NPM Organization](https://www.npmjs.com/org/spin-wheel)**
